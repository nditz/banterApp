name: Security CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore backend/BanterApp.sln
      - name: Build
        run: dotnet build backend/BanterApp.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test backend/BanterApp.Api.Tests/BanterApp.Api.Tests.csproj --no-build --configuration Release --verbosity normal
      - name: Vulnerable packages
        run: dotnet list backend/BanterApp.Api/BanterApp.Api.csproj package --vulnerable --include-transitive
        continue-on-error: true

  ef-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/BanterApp.Api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
      - name: Restore .NET tools
        working-directory: backend
        run: dotnet tool restore
      - name: Restore project
        run: dotnet restore
      - name: Fail if the EF model has no matching migration
        env:
          # Design-time factory needs a connection string; this command does not connect.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/postgres
        run: dotnet ef migrations has-pending-model-changes

  docker-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Render API image
        run: docker build -f backend/Dockerfile backend

  hosting-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Vercel / Render / Supabase repo settings
        run: python3 .github/scripts/check_hosting_config.py

  frontend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run lint
      - run: npm audit --audit-level=high
        continue-on-error: true
