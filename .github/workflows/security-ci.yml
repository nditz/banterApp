name: Security CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore backend/BanterApp.sln
      - name: Build
        run: dotnet build backend/BanterApp.sln --no-restore
      - name: Test
        run: dotnet test backend/BanterApp.Api.Tests/BanterApp.Api.Tests.csproj --no-build --verbosity normal
      - name: Vulnerable packages
        run: dotnet list backend/BanterApp.Api/BanterApp.Api.csproj package --vulnerable --include-transitive
        continue-on-error: true

  frontend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
        continue-on-error: true
